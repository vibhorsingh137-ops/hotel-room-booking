<!DOCTYPE html>
<html>
<head>
    <title>Hotel room booking</title>
</head>
<body>

    <h2>HOTEL ROOM BOOKING FORM</h2>

    <form>

        <label>Full Name:</label>
        <input type="text" name="fullname" placeholder="Enter your name">
        <br><br>

        <label>Email:</label>
        <input type="email" name="email" placeholder="Enter your email">
        <br><br>

        <label>Phone:</label>
        <input type="number" name="phone" placeholder="Enter your mobile no">
        <br><br>

        
        <label>Check in date :</label>
        <input type="date" name="cid">
        <br><br>

        <label>Check out date :</label>
        <input type="date" name="cod">
        <br><br>
        <label>Room type</label>
        <select name="Room type">
          <option>single room</option>
          <option>family room</option>
          <option>dormitory</option>
        </select>
        <br><br>
        <label> No of guests: </label>
        <input type="number" >
        <br><br>
        <label>special requests :</label>
        <input <textarea name="special request" id=special rows="10" cols="50"></textarea>
        <br><br>
        
        <input type="submit" value="Register">
        <input type="reset" value="Clear">

    </form>

</body>
</html>
